<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizumachi｜申請書類自動生成（東京都水道局様式）</title>
<style>
  :root{
    --blue:#0369a1; --blue-d:#075985; --blue-l:#e0f2fe;
    --ink:#1e293b; --sub:#64748b; --line:#cbd5e1; --bg:#f1f5f9;
    --ok:#059669; --warn:#b45309;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  }
  header.app{
    background:linear-gradient(120deg,var(--blue-d),var(--blue));
    color:#fff; padding:14px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header.app .logo{font-size:20px; font-weight:700; letter-spacing:.04em;}
  header.app .logo small{font-weight:400; opacity:.85; margin-left:10px; font-size:12px;}
  header.app .spacer{flex:1;}
  header.app button{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.5);
    border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer;
  }
  header.app button:hover{background:rgba(255,255,255,.28);}
  .notice{
    margin:14px 22px 0; padding:10px 14px; background:#fffbeb; border:1px solid #fcd34d;
    border-radius:8px; font-size:12.5px; color:#78350f;
  }
  main{
    display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:18px;
    padding:16px 22px 60px; max-width:1280px; margin:0 auto;
  }
  @media(max-width:960px){ main{grid-template-columns:1fr;} }

  /* ---- 入力フォーム ---- */
  .sec{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    margin-bottom:14px; overflow:hidden;
  }
  .sec>h2{
    font-size:14px; padding:10px 14px; background:var(--blue-l); color:var(--blue-d);
    border-bottom:1px solid var(--line); letter-spacing:.02em;
  }
  .sec .body{padding:12px 14px; display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  @media(max-width:640px){ .sec .body{grid-template-columns:1fr;} }
  .fld{display:flex; flex-direction:column; gap:3px;}
  .fld.wide{grid-column:1/-1;}
  .fld label{font-size:12px; color:var(--sub); font-weight:600;}
  .fld input[type=text],.fld input[type=date],.fld textarea{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px;
    font-family:inherit; background:#fff;
  }
  .fld input:focus,.fld textarea:focus{outline:2px solid var(--blue); outline-offset:-1px;}
  .fld textarea{min-height:64px; resize:vertical;}
  .radios{display:flex; flex-wrap:wrap; gap:6px 14px; padding:4px 0;}
  .radios label{
    display:flex; align-items:center; gap:5px; font-size:13px; color:var(--ink);
    font-weight:400; cursor:pointer;
  }
  .hint{font-size:11.5px; color:var(--sub);}

  /* ---- 書類リスト ---- */
  aside .panel{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px;
    position:sticky; top:14px;
  }
  aside h2{font-size:15px; color:var(--blue-d); margin-bottom:4px;}
  aside .sub{font-size:12px; color:var(--sub); margin-bottom:12px;}
  .doc{
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    background:#f8fafc;
  }
  .doc .no{
    display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--blue);
    border-radius:5px; padding:1px 8px; margin-bottom:4px;
  }
  .doc .ttl{font-size:13.5px; font-weight:700;}
  .doc .desc{font-size:11.5px; color:var(--sub); margin:3px 0 8px;}
  .doc .btns{display:flex; gap:8px;}
  .doc button{
    flex:1; border-radius:8px; padding:7px 0; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .doc button.prev{background:var(--blue); color:#fff; border:1px solid var(--blue);}
  .doc button.prev:hover{background:var(--blue-d);}
  .doc button.pdf{background:#fff; color:var(--blue-d); border:1px solid var(--blue);}
  .doc button.pdf:hover{background:var(--blue-l);}

  /* ---- A4プレビュー オーバーレイ ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.65); z-index:50;
    display:flex; flex-direction:column;
  }
  .overlay.hidden{display:none;}
  .overlay-bar{
    background:#0f172a; color:#fff; padding:10px 18px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .overlay-bar .t{font-size:14px; font-weight:700;}
  .overlay-bar .spacer{flex:1;}
  .overlay-bar button{
    border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .overlay-bar .print{background:var(--blue); color:#fff; border:1px solid var(--blue);}
  .overlay-bar .close{background:transparent; color:#fff; border:1px solid #64748b;}
  .overlay-body{flex:1; overflow:auto; padding:24px 12px 60px;}

  /* ---- A4用紙 ---- */
  .sheet{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff; color:#000;
    padding:16mm 15mm; box-shadow:0 6px 30px rgba(0,0,0,.4);
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
    font-size:11.5pt; line-height:1.55;
  }
  .sheet .docdate{text-align:right; font-size:10.5pt; margin-bottom:2mm;}
  .sheet h1{
    text-align:center; font-size:17pt; font-weight:600; letter-spacing:.35em;
    margin:3mm 0 6mm;
  }
  .sheet .to{font-size:12pt; margin:3mm 0 4mm;}
  .sheet .lead{font-size:10.5pt; margin:2mm 0 4mm;}
  .sheet table{
    width:100%; border-collapse:collapse; margin:2.5mm 0; font-size:10.5pt;
  }
  .sheet th,.sheet td{
    border:1.2px solid #000; padding:1.8mm 2.4mm; vertical-align:middle; text-align:left;
    font-weight:400;
  }
  .sheet th{background:#f1f1f1; width:32mm; font-size:10pt; text-align:center;}
  .sheet .ckline{margin:1.5mm 0; font-size:11pt;}
  .ckbox{font-size:12.5pt; margin-right:1mm;}
  .fv{font-weight:600; padding:0 .5mm;}
  .fb{
    display:inline-block; border-bottom:1px dotted #555; min-width:8em; min-height:1em;
    vertical-align:bottom;
  }
  .fb.yw{min-width:2.2em;}
  .sheet .seal{
    display:inline-block; width:9mm; height:9mm; border:1px solid #888; border-radius:50%;
    color:#888; font-size:8pt; text-align:center; line-height:9mm; vertical-align:middle;
    margin-left:3mm;
  }
  .sheet .notes{font-size:9pt; color:#222; margin-top:4mm; line-height:1.6;}
  .sheet .notes li{margin-left:5mm;}
  .sheet .center{text-align:center;}
  .sheet .ki{ text-align:center; letter-spacing:1.5em; margin:4mm 0 2mm; font-size:12pt;}
  .sheet ol.items{margin:2mm 0 4mm 8mm; font-size:11pt;}
  .sheet ol.items li{margin-bottom:1mm;}
  .sheet .sign{margin-top:6mm; margin-left:50%;}
  .sheet .sign .row{margin-bottom:2mm;}

  /* ---- 印刷時：プレビュー用紙のみ出力 ---- */
  @media print{
    @page{size:A4; margin:0;}
    body *{visibility:hidden;}
    #overlay, #overlay .overlay-body, #sheetWrap{position:static !important; overflow:visible !important; padding:0 !important; background:none !important;}
    #sheetWrap .sheet, #sheetWrap .sheet *{visibility:visible;}
    #sheetWrap .sheet{
      position:absolute; left:0; top:0; margin:0; box-shadow:none; width:210mm; min-height:297mm;
    }
    .overlay-bar{display:none !important;}
  }
</style>
</head>
<body>

<header class="app">
  <div class="logo">💧 Mizumachi <small>申請書類自動生成（東京都水道局様式）</small></div>
  <div class="spacer"></div>
  <button id="btnSample" type="button">サンプル入力</button>
  <button id="btnClear" type="button">入力をクリア</button>
</header>

<div class="notice">
  ⚠️ 本フォームは「指定給水装置工事事業者工事施行要領（令和8年4月・東京都水道局）」の様式構成を基にした<strong>再現様式</strong>です。
  実際の提出には、<a href="https://www.waterworks.metro.tokyo.lg.jp/jigyosha/koji/yoshiki/koji" target="_blank" rel="noopener">東京都水道局の公式様式一覧</a>から最新の公式様式をダウンロードしてご利用ください。入力内容はこのブラウザ内（localStorage）にのみ保存されます。
</div>

<main>
  <section id="formArea"></section>
  <aside>
    <div class="panel">
      <h2>📄 生成できる書類</h2>
      <div class="sub">左のフォームに入力した1セットのデータから、各書類へ自動転記されます。</div>
      <div id="docList"></div>
    </div>
  </aside>
</main>

<div id="overlay" class="overlay hidden">
  <div class="overlay-bar">
    <span class="t" id="overlayTitle"></span>
    <span class="spacer"></span>
    <button class="print" type="button" data-doc-print>🖨 印刷 / PDF保存</button>
    <button class="close" type="button" data-doc-close>✕ 閉じる</button>
  </div>
  <div class="overlay-body"><div id="sheetWrap"></div></div>
</div>

<script>
'use strict';

/* ========== 状態 ========== */
const STORAGE_KEY = 'mizumachiDocData';
const S = {
  docPreviewId: null,
  docData: loadData()
};

function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S.docData)); }catch(e){}
}

const DEFAULT_PROXY_ITEMS =
  '1　給水装置工事（新設・改造・撤去）の申込み及び申請に関すること\n' +
  '2　設計審査及び工事検査の申込みに関すること\n' +
  '3　工事費の納入並びに清算（還付・追徴）に関すること';

/* ========== 入力フォーム定義 ========== */
const SECTIONS = [
  { title:'① 申込内容', fields:[
    {k:'appDate', label:'申込年月日', type:'date'},
    {k:'applyKind', label:'申込み区分（様式1-3）', type:'radio',
      options:['給水装置工事施行承認申込み','給水装置工事申込み','指定給水装置工事事業者設計審査申込み']},
    {k:'workType', label:'工事種別', type:'radio', options:['新設','改造','撤去']},
    {k:'customerNo', label:'お客さま番号（既設がある場合）', ph:'例：00-123456-1-0'},
    {k:'mainCustomerNo', label:'幹栓お客さま番号（支分栓工事のとき）', ph:''}
  ]},
  { title:'② 申込者（施工主）', fields:[
    {k:'ownerKana', label:'フリガナ', ph:'スイドウ タロウ'},
    {k:'ownerName', label:'氏名（法人は法人名＋代表者名を併記）', ph:'水道 太郎'},
    {k:'ownerZip', label:'郵便番号', ph:'160-0023'},
    {k:'ownerTel', label:'電話番号', ph:'03-0000-0000'},
    {k:'ownerAddr', label:'住所', ph:'東京都新宿区西新宿○丁目○番○号', wide:true}
  ]},
  { title:'③ 工事場所', fields:[
    {k:'siteAddr', label:'工事場所（住所）', ph:'東京都新宿区西新宿○丁目○番○号', wide:true},
    {k:'siteBuilding', label:'建物名・部屋番号（あれば）'},
    {k:'siteUse', label:'用途', ph:'一般住宅／共同住宅／店舗 など'}
  ]},
  { title:'④ 指定給水装置工事事業者（委任代理人）', fields:[
    {k:'companyName', label:'事業者名', ph:'○○工業所株式会社'},
    {k:'companyNo', label:'指定番号', ph:'第12345号'},
    {k:'companyRep', label:'代表者名', ph:'代表取締役 ○○ ○○'},
    {k:'companyTel', label:'電話番号', ph:'03-0000-0000'},
    {k:'companyAddr', label:'所在地', ph:'東京都○○区○○一丁目2番3号', wide:true}
  ]},
  { title:'⑤ 給水装置工事主任技術者', fields:[
    {k:'engineerName', label:'氏名'},
    {k:'engineerLicense', label:'免状交付番号', ph:'第654321号'}
  ]},
  { title:'⑥ 工事内容・メータ・工事費請求先', fields:[
    {k:'meterDiaNew', label:'メータ呼び径（新）', ph:'20mm　※新設・口径変更のとき'},
    {k:'meterDiaOld', label:'メータ呼び径（旧）', ph:'※口径変更・再使用・撤去のとき'},
    {k:'existing', label:'同一敷地内の既設給水装置', type:'radio', options:['無','有（使用中）','有（中止中）']},
    {k:'billTo', label:'工事費請求先', type:'radio', options:['申込者','委任代理人','その他']},
    {k:'billOther', label:'請求先その他（住所・氏名・電話番号）', ph:'「その他」のときのみ', wide:true},
    {k:'workSummary', label:'工事概要・摘要', type:'textarea',
      ph:'例：配水小管φ100mmより分岐し、給水管φ20mmを新設、メータ（呼び径20mm）を設置する。', wide:true}
  ]},
  { title:'⑦ 完工・検査の情報（様式2-1／37-2 用）', fields:[
    {k:'designApprovedDate', label:'設計審査日', type:'date'},
    {k:'completionDate', label:'完工日', type:'date'},
    {k:'inspectionDate', label:'工事検査申込日', type:'date'},
    {k:'drawingDate', label:'完成図提出日', type:'date'},
    {k:'chlorineValue', label:'残留塩素（遊離）濃度 mg/L', ph:'例：0.4'},
    {k:'chlorineDate', label:'残留塩素測定日', type:'date'}
  ]},
  { title:'⑧ 取消・設計変更・施行延期（様式3-1 用）', fields:[
    {k:'changeKind', label:'届出の種類', type:'radio', options:['取消','設計変更','施行延期']},
    {k:'changeDetail', label:'変更（延期）の内容', type:'textarea', wide:true},
    {k:'changeReason', label:'理由', type:'textarea', wide:true}
  ]},
  { title:'⑨ 各種届出（様式277 用）', fields:[
    {k:'notifyKind', label:'届出の種類', ph:'例：給水装置確認申込み'},
    {k:'notifyDate', label:'届出年月日', type:'date'},
    {k:'notifyDetail', label:'届出の内容', type:'textarea', wide:true}
  ]},
  { title:'⑩ 委任状', fields:[
    {k:'proxyDate', label:'委任年月日', type:'date'},
    {k:'proxyItems', label:'委任事項（必要に応じて編集）', type:'textarea', default:DEFAULT_PROXY_ITEMS, wide:true}
  ]}
];

/* ========== 書類定義 ========== */
const DOCS = [
  {id:'1-3', no:'様式1-3', title:'給水装置工事申請申込書',
    desc:'工事申込み・施行承認・設計審査をまとめて申し込む基本様式。使う欄：①〜⑥', render:renderDoc_13},
  {id:'2-1', no:'様式2-1', title:'指定給水装置工事事業者工事調書',
    desc:'新設・改造・撤去工事の経過（設計審査〜完工）をまとめる調書。使う欄：①〜⑦', render:renderDoc_21},
  {id:'37-2', no:'様式37-2', title:'指定給水装置工事事業者工事検査申込書',
    desc:'工事完了後に都の工事検査を申し込む様式。残留塩素測定値を記入。使う欄：①〜⑤・⑦', render:renderDoc_372},
  {id:'3-1', no:'様式3-1', title:'給水装置工事取消・設計変更・施行延期届',
    desc:'申込み済みの工事を取り消し・変更・延期するときの届。使う欄：①〜④・⑧', render:renderDoc_31},
  {id:'277', no:'様式277', title:'給水装置関係各種届出書',
    desc:'給水装置確認申込みなど各種届出に使う汎用様式。使う欄：②〜④・⑨', render:renderDoc_277},
  {id:'inin', no:'参考様式', title:'委任状',
    desc:'申込者が指定事業者に申請手続を委任する書類（任意様式）。使う欄：②〜④・⑩', render:renderDoc_inin}
];

/* ========== ヘルパー ========== */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function gv(k){ return (S.docData[k] || '').trim(); }
function v(k, w){
  const x = gv(k);
  return x ? '<span class="fv">' + esc(x).replace(/\n/g,'<br>') + '</span>'
           : '<span class="fb" style="min-width:' + (w || 8) + 'em"></span>';
}
function ck(cond){ return '<span class="ckbox">' + (cond ? '☑' : '☐') + '</span>'; }
function dt(k){
  const iso = gv(k);
  if(!iso) return '令和<span class="fb yw"></span>年<span class="fb yw"></span>月<span class="fb yw"></span>日';
  const p = iso.split('-');
  const y = Number(p[0]) - 2018, m = Number(p[1]), d = Number(p[2]);
  return '令和<span class="fv">' + y + '</span>年<span class="fv">' + m + '</span>月<span class="fv">' + d + '</span>日';
}
function partyTable(){
  return '' +
  '<table>' +
    '<tr><th rowspan="2">申込者<br>（施工主）</th>' +
      '<td style="width:38mm">フリガナ</td><td>' + v('ownerKana',10) + '</td></tr>' +
    '<tr><td>氏名</td><td>' + v('ownerName',10) + '<span class="seal">印</span></td></tr>' +
    '<tr><th>住所</th><td colspan="2">〒' + v('ownerZip',4) + '　' + v('ownerAddr',16) +
      '　電話 ' + v('ownerTel',6) + '</td></tr>' +
    '<tr><th>工事場所</th><td colspan="2">' + v('siteAddr',16) + '　' + v('siteBuilding',0) + '</td></tr>' +
  '</table>';
}
function companyTable(withEngineer){
  let h = '' +
  '<table>' +
    '<tr><th rowspan="2">指定給水装置<br>工事事業者<br>（委任代理人）</th>' +
      '<td style="width:38mm">指定番号</td><td>' + v('companyNo',6) +
      '　電話 ' + v('companyTel',6) + '</td></tr>' +
    '<tr><td>所在地・名称</td><td>' + v('companyAddr',12) + '<br>' + v('companyName',10) +
      '　' + v('companyRep',0) + '<span class="seal">印</span></td></tr>';
  if(withEngineer){
    h += '<tr><th>給水装置工事<br>主任技術者</th>' +
      '<td style="width:38mm">氏名</td><td>' + v('engineerName',8) +
      '　免状交付番号 ' + v('engineerLicense',6) + '</td></tr>';
  }
  h += '</table>';
  return h;
}

/* ========== 書類テンプレート ========== */
function renderDoc_13(){
  const ak = gv('applyKind'), wt = gv('workType'), bt = gv('billTo'), ex = gv('existing');
  return '' +
  '<div class="docdate">申込月日　' + dt('appDate') + '</div>' +
  '<h1>給水装置工事申請申込書</h1>' +
  '<div class="to">東京都水道局長　殿</div>' +
  '<div class="lead">◎裏面誓約事項等を確認の上、該当する申込み・申請項目に「✔」印を付け、必要事項を記入してください。</div>' +
  '<div class="ckline">' +
    ck(ak==='給水装置工事施行承認申込み') + '給水装置工事施行承認申込み　' +
    ck(ak==='給水装置工事申込み') + '給水装置工事申込み　' +
    ck(ak==='指定給水装置工事事業者設計審査申込み') + '指定給水装置工事事業者設計審査申込み' +
  '</div>' +
  '<div class="ckline">工事種別：' +
    ck(wt==='新設') + '新設　' + ck(wt==='改造') + '改造　' + ck(wt==='撤去') + '撤去' +
  '</div>' +
  '<table>' +
    '<tr><th>お客さま番号</th><td>' + v('customerNo',10) + '</td>' +
    '<th>幹栓<br>お客さま番号</th><td>' + v('mainCustomerNo',8) + '</td></tr>' +
  '</table>' +
  partyTable() +
  companyTable(true) +
  '<table>' +
    '<tr><th>用途</th><td>' + v('siteUse',8) + '</td>' +
    '<th>メータ呼び径</th><td>新：' + v('meterDiaNew',4) + '　旧：' + v('meterDiaOld',4) + '</td></tr>' +

/* ========== 画面描画（初回のみ） ========== */
function buildForm(){
  let h = '';
  for(const sec of SECTIONS){
    h += '<div class="sec"><h2>' + esc(sec.title) + '</h2><div class="body">';
    for(const f of sec.fields){
      const cur = S.docData[f.k] != null ? S.docData[f.k] : (f.default || '');
      if(S.docData[f.k] == null && f.default){ S.docData[f.k] = f.default; }
      h += '<div class="fld' + (f.wide || f.type==='radio' || f.type==='textarea' ? ' wide' : '') + '">';
      h += '<label>' + esc(f.label) + '</label>';
      if(f.type === 'radio'){
        h += '<div class="radios">';
        for(const op of f.options){
          h += '<label><input type="radio" name="' + esc(f.k) + '" value="' + esc(op) + '"' +
               ' data-doc-field="' + esc(f.k) + '"' + (cur === op ? ' checked' : '') + '>' + esc(op) + '</label>';
        }
        h += '</div>';
      } else if(f.type === 'textarea'){
        h += '<textarea data-doc-field="' + esc(f.k) + '" placeholder="' + esc(f.ph || '') + '">' + esc(cur) + '</textarea>';
      } else {
        h += '<input type="' + (f.type === 'date' ? 'date' : 'text') + '" data-doc-field="' + esc(f.k) + '"' +
             ' value="' + esc(cur) + '" placeholder="' + esc(f.ph || '') + '">';
      }
      h += '</div>';
    }
    h += '</div></div>';
  }
  document.getElementById('formArea').innerHTML = h;
}

function buildDocList(){
  let h = '';
  for(const d of DOCS){
    h += '<div class="doc">' +
      '<span class="no">' + esc(d.no) + '</span>' +
      '<div class="ttl">' + esc(d.title) + '</div>' +
      '<div class="desc">' + esc(d.desc) + '</div>' +
      '<div class="btns">' +
        '<button type="button" class="prev" data-doc-preview="' + esc(d.id) + '">👁 プレビュー</button>' +
        '<button type="button" class="pdf" data-doc-pdf="' + esc(d.id) + '">🖨 PDF</button>' +
      '</div></div>';
  }
  document.getElementById('docList').innerHTML = h;
}

function openPreview(id){
  const doc = DOCS.find(function(d){ return d.id === id; });
  if(!doc) return;
  S.docPreviewId = id;
  document.getElementById('overlayTitle').textContent = doc.no + '　' + doc.title;
  document.getElementById('sheetWrap').innerHTML = '<div class="sheet">' + doc.render() + '</div>';
  document.getElementById('overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closePreview(){
  S.docPreviewId = null;
  document.getElementById('overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

/* ========== イベント ========== */
function attach(){
  // 入力：再renderせずS.docDataだけサイレント更新（フォーカスが飛ばないように）
  function onEdit(e){
    const t = e.target;
    const k = t.getAttribute && t.getAttribute('data-doc-field');
    if(!k) return;
    S.docData[k] = t.value;
    saveData();
  }
  document.addEventListener('input', onEdit);
  document.addEventListener('change', onEdit);

  document.addEventListener('click', function(e){
    const prev = e.target.closest('[data-doc-preview]');
    if(prev){ openPreview(prev.getAttribute('data-doc-preview')); return; }

    const pdf = e.target.closest('[data-doc-pdf]');
    if(pdf){
      openPreview(pdf.getAttribute('data-doc-pdf'));
      setTimeout(function(){ window.print(); }, 150);
      return;
    }
    if(e.target.closest('[data-doc-print]')){ window.print(); return; }
    if(e.target.closest('[data-doc-close]')){ closePreview(); return; }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && S.docPreviewId) closePreview();
  });

  document.getElementById('btnSample').addEventListener('click', function(){
    fillSample();
  });
  document.getElementById('btnClear').addEventListener('click', function(){
    if(!confirm('入力内容をすべてクリアします。よろしいですか？')) return;
    S.docData = {};
    saveData();
    buildForm();
  });
}
